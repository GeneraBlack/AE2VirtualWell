name: Release to CurseForge & GitHub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_type:
        description: "Release Type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha
      changelog:
        description: "Changelog text"
        required: false
        default: "Release of AE2 Virtual Well for Minecraft 26.1.2 (NeoForge)."
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25 (Toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Java 21 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mod JAR
        run: ./gradlew build --no-daemon

      - name: Determine Version Tag
        id: version_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v$(grep 'mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Publish to CurseForge & GitHub Releases
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # CurseForge Publishing
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # Modrinth Publishing (optional if secrets are provided)
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # GitHub Release Publishing
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version_info.outputs.tag }}

          # File & Metadata configuration
          files: build/libs/!(*-sources|*-javadoc).jar
          name: "AE2 Virtual Well ${{ steps.version_info.outputs.tag }}"
          version: ${{ steps.version_info.outputs.tag }}
          version-type: ${{ inputs.version_type || 'release' }}
          changelog: "${{ inputs.changelog || 'Fix JEI/REI/EMI ghost-item and unowned fluid dupe exploit in Cell Workbench via slot filter, inventory possession verification, and server-side grid validation.' }}"

          # Compatibility matrix
          game-versions: |
            26.1.2
          loaders: |
            neoforge
          dependencies: |
            ae2(required)
